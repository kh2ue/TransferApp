plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    applicationVariants.all { variant -> variant.outputs.all { outputFileName = "TransferApp.apk" } }

    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }

    namespace 'com.pos.transferapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.pos.transferapp"
        minSdk 24
        targetSdk 34
        renderscriptTargetApi 31
        renderscriptSupportModeEnabled true
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'
}